server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-observability.yml
  application:
    name: stratos-gateway

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        username: nacos
        password: nacos
        refresh-enabled: true
        import-check:
          enabled: false

    sentinel:
      eager: true
      transport:
        dashboard: localhost:8858
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"too many requests","success":false}'
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: stratos-auth
          uri: lb://stratos-auth
          predicates:
            - Path=/auth/**
        - id: stratos-auth-api
          uri: lb://stratos-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: stratos-user
          uri: lb://stratos-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: stratos-user-address
          uri: lb://stratos-user
          predicates:
            - Path=/api/address/**
          filters:
            - StripPrefix=1
        - id: stratos-product
          uri: lb://stratos-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: stratos-order
          uri: lb://stratos-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: stratos-order-cart
          uri: lb://stratos-order
          predicates:
            - Path=/api/cart/**
          filters:
