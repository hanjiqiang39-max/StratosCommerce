# 本机可 apply，不依赖现有集群。镜像先 mvn package 再 docker build。
# Nacos / MySQL / Redis 地址用环境变量覆盖。
apiVersion: v1
kind: ConfigMap
metadata:
  name: stratos-infra
data:
  NACOS_SERVER_ADDR: nacos.stratos.svc.cluster.local:8848
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos.stratos.svc.cluster.local:8848
  SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
  SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: "123456"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratos-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stratos-gateway
  template:
    metadata:
      labels:
        app: stratos-gateway
    spec:
      containers:
        - name: app
          image: stratos/stratos-gateway:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: stratos-infra
---
apiVersion: v1
kind: Service
metadata:
  name: stratos-gateway
spec:
  type: NodePort
  selector:
    app: stratos-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
