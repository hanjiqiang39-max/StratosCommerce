# 商城 shop.example.com → stratos-shop-web/dist
# 后台 admin.example.com → stratos-admin-web/dist
# 商家 merchant.example.com → stratos-merchant-web/dist
# /api 反代网关 8080

upstream stratos_gateway {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name shop.example.com;
    root /usr/share/nginx/html/shop;
    index index.html;

    location /api/ {
        proxy_pass http://stratos_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        proxy_pass http://stratos_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name merchant.example.com;
    root /usr/share/nginx/html/merchant;
    index index.html;

    location /api/ {
        proxy_pass http://stratos_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
