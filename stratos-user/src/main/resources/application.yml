server:
  port: 8082

spring:
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:classpath:application-observability.yml
  application:
    name: stratos-user

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        username: nacos
        password: nacos
        refresh-enabled: true
        import-check:
          enabled: false

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stratos_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

stratos:
  notification:
    base-url: http://localhost:8092

oauth:
  frontend-callback: http://localhost:5173/oauth/callback
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/api/user/oauth/wechat/callback}
  alipay:
    sandbox: true
    app-id: ${OAUTH_ALIPAY_APP_ID:${ALIPAY_APP_ID:}}
    private-key: ${OAUTH_ALIPAY_PRIVATE_KEY:${ALIPAY_PRIVATE_KEY:}}
    alipay-public-key: ${OAUTH_ALIPAY_PUBLIC_KEY:${ALIPAY_PUBLIC_KEY:}}
    redirect-uri: ${OAUTH_ALIPAY_REDIRECT_URI:http://localhost:8080/api/user/oauth/alipay/callback}
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do

logging:
  level:
    root: INFO
    com.stratos: DEBUG

knife4j:
  enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
