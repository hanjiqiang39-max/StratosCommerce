server:
  port: 8090

spring:
  config:
    import: optional:classpath:application-observability.yml
  application:
    name: stratos-system

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        namespace: public
        file-extension: yaml
        username: nacos
        password: nacos
        refresh-enabled: true
        import-check:
          enabled: false

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stratos_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 9

logging:
  level:
    root: INFO
    com.stratos: DEBUG

stratos:
  upload:
    dir: uploads
  user:
    base-url: http://localhost:8082

knife4j:
  enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
